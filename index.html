<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Artboard Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">

  <!-- Header -->
  <div class="panel-header">
    <div class="header-left">
      <h1>Artboard Manager</h1>
      <span id="artboardCount" class="count-badge">0</span>
    </div>
    <div class="header-right">
      <button id="btnTheme" class="icon-btn">☽</button>
    </div>
  </div>

  <!-- No document -->
  <div id="noDocState" class="empty-state" style="display:none;">
    <div class="empty-icon">&#9634;</div>
    <p data-i18n="noDoc">請先在 Illustrator 開啟一個文件</p>
    <button class="btn btn-ghost btn-sm" id="btnRetry" style="margin-top:8px;" data-i18n="refresh">重新整理</button>
  </div>

  <!-- Artboard list -->
  <div id="artboardList" class="artboard-list"></div>

  <!-- Bottom buttons -->
  <div id="addSection" class="add-section" style="display:none;">
    <div class="add-btn-row">
      <button id="btnShowAdd"   class="btn btn-cta"   data-i18n="btnAdd">&#xFF0B; 新增工作區域</button>
      <button id="btnShowCombo" class="btn btn-combo"  data-i18n="btnCombo">&#9783; 選擇新增組合</button>
    </div>
  </div>

  <!-- Footer -->
  <div class="panel-footer">
    <span id="docName">—</span>
    <span data-i18n="version">Artboard Manager v1.3</span>
  </div>

  <!-- Copyright -->
  <div class="copyright">Lurn Creative Ltd. &nbsp;Triple.Cell_illustration</div>

  <!-- ════════════════════════════════════
       Modal A：新增工作區域
  ════════════════════════════════════ -->
  <div id="addModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-header-title" data-i18n="modalAddTitle">新增工作區域</span>
        <button class="modal-close btn-close-modal">&#x2715;</button>
      </div>
      <div class="modal-body">

        <!-- 單位 + 間距 -->
        <div class="modal-unit-row">
          <span class="section-label" data-i18n="unitLabel">單位</span>
          <div class="unit-toggle" id="unitToggleSingle">
            <button class="unit-btn" data-unit="mm">mm</button>
            <button class="unit-btn" data-unit="cm">cm</button>
            <button class="unit-btn active" data-unit="px">px</button>
          </div>
          <div class="gap-field">
            <span class="section-label" data-i18n="gapLabel">新增間距</span>
            <input type="number" id="addGap" class="gap-input" value="250" min="0" step="1">
          </div>
          <div class="dir-field">
            <span class="section-label" data-i18n="dirLabel">方向</span>
            <div class="dir-toggle" id="dirToggleSingle">
              <button class="dir-btn active" data-dir="right" data-i18n="dirRight">→ 往右</button>
              <button class="dir-btn" data-dir="down" data-i18n="dirDown">↓ 往下</button>
            </div>
          </div>
        </div>

        <!-- 預設 chips -->
        <span class="section-label" data-i18n="presetLabel">預設尺寸</span>
        <div class="preset-grid" id="presetGridSingle"></div>

        <!-- 儲存自訂預設 -->
        <div id="savePresetRow" class="save-preset-row" style="display:none;">
          <input type="text" id="savePresetName" class="input-sm" data-i18n-ph="presetNamePh" placeholder="預設名稱">
          <button id="btnSavePreset"  class="btn btn-primary btn-sm" data-i18n="saveBtn">儲存</button>
          <button id="btnCancelSave"  class="btn btn-ghost   btn-sm">✕</button>
        </div>
        <button id="btnShowSavePreset" class="btn-text-link" style="margin-bottom:10px;display:block;" data-i18n="saveCurrentSize">＋ 儲存目前尺寸為預設</button>

        <!-- 名稱 + W/H -->
        <div class="modal-field">
          <label data-i18n="nameOptional">名稱（選填）</label>
          <input type="text" id="addName" class="input-full" data-i18n-ph="nameAutoPh" placeholder="留空自動命名">
        </div>
        <div class="form-two-col">
          <div class="form-field">
            <label>W (<span class="unit-display-add">px</span>)</label>
            <input type="number" id="addWidth" placeholder="1920" min="1" step="0.01">
          </div>
          <div class="form-field">
            <label>H (<span class="unit-display-add">px</span>)</label>
            <input type="number" id="addHeight" placeholder="1080" min="1" step="0.01">
          </div>
        </div>

      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost btn-sm btn-close-modal" data-i18n="cancel">取消</button>
        <button id="btnConfirmAdd" class="btn btn-cta btn-sm" data-i18n="add">新增</button>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════════════
       Modal B：選擇 / 建立組合
  ════════════════════════════════════ -->
  <div id="comboModal" class="modal-overlay">
    <div class="modal-card">

      <!-- View 1: 選擇組合 -->
      <div id="comboSelectView">
        <div class="modal-header">
          <span class="modal-header-title" data-i18n="comboSelectTitle">選擇新增組合</span>
          <button class="modal-close btn-close-combo">&#x2715;</button>
        </div>
        <div class="modal-body">
          <div class="combo-hint" data-i18n-html="comboHint">請選擇已有的組合，套用後第一個尺寸會<strong>修改現有工作區域</strong>，其餘依序<strong>往右新增</strong>。</div>
          <div id="comboCardList"></div>
          <button id="btnCreateCombo" class="btn-create-combo" data-i18n="createNewCombo">＋ 建立新組合</button>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost btn-sm btn-close-combo" data-i18n="close">關閉</button>
          <button id="btnApplySelectedCombo" class="btn btn-cta btn-sm" disabled data-i18n="applyCombo">套用組合</button>
        </div>
      </div>

      <!-- View 2: 建立 / 編輯組合 -->
      <div id="comboBuildView" style="display:none; flex-direction:column; min-height:0; flex:1; overflow:hidden;">
        <div class="modal-header">
          <div class="builder-back">
            <button id="btnBackToSelect" class="btn-back" title="返回">&#8592;</button>
            <span class="builder-title" id="comboBuildTitle" data-i18n="buildComboTitle">建立新組合</span>
          </div>
          <button class="modal-close btn-close-combo">&#x2715;</button>
        </div>
        <div class="modal-body">

          <div class="modal-field">
            <label data-i18n="comboNameLabel">組合名稱</label>
            <input type="text" id="comboBuildName" class="input-full" data-i18n-ph="comboNamePh" placeholder="例：社群媒體全尺寸">
          </div>

          <div class="modal-unit-row">
            <span class="section-label" data-i18n="unitLabel">單位</span>
            <div class="unit-toggle" id="unitToggleCombo">
              <button class="unit-btn" data-unit="mm">mm</button>
              <button class="unit-btn" data-unit="cm">cm</button>
              <button class="unit-btn active" data-unit="px">px</button>
            </div>
            <div class="gap-field">
              <span class="section-label" data-i18n="gapLabel">新增間距</span>
              <input type="number" id="comboGap" class="gap-input" value="250" min="0" step="1">
            </div>
            <div class="dir-field">
              <span class="section-label" data-i18n="dirLabel">方向</span>
              <div class="dir-toggle" id="dirToggleCombo">
                <button class="dir-btn active" data-dir="right" data-i18n="dirRight">→ 往右</button>
                <button class="dir-btn" data-dir="down" data-i18n="dirDown">↓ 往下</button>
              </div>
            </div>
          </div>

          <span class="section-label" data-i18n="sizesLabel">尺寸設定</span>
          <div id="comboRows" class="combo-rows"></div>
          <button id="btnAddComboRow" class="btn-text-link" data-i18n="addArtboardRow">＋ 新增工作區域</button>

        </div>
        <div class="modal-footer">
          <button id="btnCancelBuild"    class="btn btn-ghost   btn-sm" data-i18n="cancel">取消</button>
          <button id="btnSaveBuildCombo" class="btn btn-primary btn-sm" data-i18n="createCombo">建立此組合</button>
        </div>
      </div>

    </div>
  </div>

</div><!-- /app -->

<div id="toast" class="toast"></div>

<script src="js/CSInterface.js"></script>
<script src="js/main.js"></script>
</body>
</html>
